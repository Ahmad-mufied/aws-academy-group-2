version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      # - master-service
      - product-service
      # - user-service
    volumes:
      - ./api-config.toml:/api-config.toml

#  master-service:
