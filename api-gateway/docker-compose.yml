#      endpoint_mode: dnsrr

  product-service:
    image: yourorg/product-service:latest
    deploy:
      replicas: 2
      endpoint_mode: dnsrr

  user-service:
    image: yourorg/user-service:latest
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
