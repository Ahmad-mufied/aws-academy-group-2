<div class="container">
  <div class="header">
    <div class="title-wrapper">
      <div class="title-section">
        <h1>User Management</h1>
      </div>
      <div class="add-user-section">
        <button mat-raised-button color="primary" class="add-user-btn" (click)="openUserForm()">
          <mat-icon>add</mat-icon> Add New User
        </button>
      </div>
    </div>
    <div class="search-actions">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search users</mat-label>
        <input matInput [(ngModel)]="searchQuery" (ngModelChange)="applyFilters()">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <div class="filter-controls">
        <button mat-icon-button (click)="openFilterDialog()" matTooltip="Filter options">
          <mat-icon>filter_list</mat-icon>
        </button>
        <button mat-icon-button (click)="resetFilters()" matTooltip="Reset filters">
          <mat-icon>restart_alt</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <table mat-table [dataSource]="filteredUsers" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{user.name}}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{user.email}}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">{{user.role}}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let user">{{user.status}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button (click)="viewDetails(user)" matTooltip="View Details">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button (click)="editUser(user)" matTooltip="Edit User">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="assignProducts(user)" matTooltip="Assign Products">
          <mat-icon>assignment</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteUser(user)" matTooltip="Delete User">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
