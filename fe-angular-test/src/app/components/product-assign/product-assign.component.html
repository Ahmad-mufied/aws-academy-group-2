<div class="dialog-container">
  <h2 mat-dialog-title>Assign Products</h2>
  <mat-dialog-content class="dialog-content">
    <div *ngFor="let product of availableProducts" class="product-item">
      <mat-checkbox [(ngModel)]="product.selected" (change)="toggleParentSelection(product)">
        {{ product.name }}
      </mat-checkbox>
      <ul class="subtask-list">
        <li *ngFor="let subtask of product.subtasks">
          <mat-checkbox [(ngModel)]="subtask.selected">
            {{ subtask.name }}
          </mat-checkbox>
        </li>
      </ul>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button color="primary" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </mat-dialog-actions>
</div>
