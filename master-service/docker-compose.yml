services:
  master-service:
    image: master-service:latest
    build: 
      context: .
      dockerfile: ./docker/app.dockerfile
    container_name: master-service
    depends_on:
      master-db:
        condition: service_healthy
    restart: always
    ports:
      - "8001:8001"
    networks:
      - master-network
  
  master-db:
    image: mysql:latest
    container_name: master_service_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - master-network
    volumes:
      - master-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  migration:
    image: migrate-master-db:latest
    container_name: migrate_master_db
    build:
      context: .
      dockerfile: ./docker/migrate.dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    env_file:
      - .env
    depends_on:
      master-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - master-network
  
networks:
  master-network:
    name: master-network

volumes:
  master-db-data:
    name: master-db-data
    labels:
      - "Master database volume"