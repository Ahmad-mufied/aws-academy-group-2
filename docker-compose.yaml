version: '3.8'

services:
  
  app:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: always
    ports:
      - "8081:8080"
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/
      - WEB_SERVER_PORT=8080
    depends_on:
      - mongodb
    networks:
      - myapp-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017" # Expose MongoDB on localhost:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db # Persist MongoDB data
    networks:
      - myapp-network

  db:
    container_name: db_container
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: aws_academy123
      MYSQL_DATABASE: user_db
      MYSQL_USER: david
      MYSQL_PASSWORD: david123
    ports:
      - "3308:3306"
    networks:
      - myapp-network
    volumes:
      - db-data:/var/lib/mysql

  migration:
    container_name: migration_container
    build:
      context: ./user-service
      dockerfile: ./build/package/migrate.dockerfile
    command: ["-verbose", "up"]
    restart: on-failure
    env_file:
      - ./user-service/.env.docker
    depends_on:
      - db
    networks:
      - myapp-network

  backend:
    container_name: app_container
    restart: on-failure
    build:
      context: ./user-service
      dockerfile: ./build/package/app.dockerfile
    env_file:
      - ./user-service/.env.docker
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - myapp-network

  master-service:
    image: master-service:latest
    build: 
      context: ./master-service
      dockerfile: ./docker/app.dockerfile
    container_name: master-service
    depends_on:
      master-db:
        condition: service_healthy
    restart: always
    ports:
      - "8001:8001"
    networks:
      - myapp-network
  
  master-db:
    image: mysql:latest
    container_name: master_service_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - myapp-network
    volumes:
      - master-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  migration-master-db:
    image: migrate-master-db:latest
    container_name: migrate_master_db
    build:
      context: ./master-service
      dockerfile: ./docker/migrate.dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    env_file:
      - ./master-service/.env
    depends_on:
      master-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - myapp-network

  seeder:
    image: seed-master-db:latest
    container_name: seed_master_db
    build:
      context: ./master-service
      dockerfile: ./docker/seed.dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    env_file:
      - ./master-service/.env
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - myapp-network

networks:
  myapp-network:
    driver: bridge

volumes:
  db-data:
  master-db-data:
    name: master-db-data
    labels:
      - "Master database volume"
  mongodb_data:
    driver: local # Use local driver for persistence



