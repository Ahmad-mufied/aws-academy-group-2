<mat-card class="user-list-card">
  <mat-toolbar color="primary">
    <span>User List</span>
    <span class="spacer"></span>
    <!-- Add any filter/search inputs here if needed -->
  </mat-toolbar>

  <div class="table-container">
    <table mat-table [dataSource]="users" class="mat-elevation-z8">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
      </ng-container>

      <!-- Date of Birth Column -->
      <ng-container matColumnDef="dob">
        <th mat-header-cell *matHeaderCellDef> DoB </th>
        <td mat-cell *matCellDef="let user"> {{ user.dob | date:'yyyy-MM-dd' }} </td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Role </th>
        <td mat-cell *matCellDef="let user"> {{ user.role }} </td>
      </ng-container>

      <!-- Registered Date Column -->
      <ng-container matColumnDef="registeredDate">
        <th mat-header-cell *matHeaderCellDef> Registered Date </th>
        <td mat-cell *matCellDef="let user"> {{ user.registeredDate | date:'yyyy-MM-dd' }} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let user">
          <mat-icon [color]="user.status === 'Active' ? 'primary' : 'warn'"
                    matTooltip="{{ user.status === 'Active' ? 'Active' : 'Inactive' }}">
            {{ user.status === 'Active' ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary" (click)="viewUser(user)" matTooltip="View">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="editUser(user)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
           <button mat-icon-button color="primary" (click)="assignRole(user)" matTooltip="Assign Role">
            <mat-icon>assignment_ind</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
     <mat-paginator
      [length]="users.length"
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page"
      showFirstLastButtons
    >
    </mat-paginator>
  </div>
</mat-card>
